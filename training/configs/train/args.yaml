# ---------- БАЗА: задача и режим ----------
task: detect
mode: train

# ---------- МОДЕЛЬ И ДАТАСЕТ ----------
model: training/pretrained_models/yolov8s.pt      # переопределишь на epoch40.pt для финтюна
data: training/rdd_split.yaml

# ---------- ОБУЧЕНИЕ ----------
epochs: 100
patience: 20
batch: 32
imgsz: 640
device: 0                # или "0", ноутбук может это менять
workers: 4
pretrained: true
optimizer: auto
seed: 1337
deterministic: true
rect: false
val: true
split: val

# ---------- LR SCHEDULE ----------
cos_lr: true
lr0: 0.01              # базовое значение; для финтюна в коде поднимешь до 0.002–0.003
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 5
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ---------- ВЕСА ЛОССОВ ----------
box: 7.5
cls: 0.5                # базовое; для дообучения можно поднять до 0.8
dfl: 1.5
nbs: 64

# ---------- АУГМЕНТАЦИИ ----------
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
copy_paste_mode: flip
close_mosaic: 10
auto_augment: randaugment
erasing: 0.4
bgr: 0.0

# прочее
overlap_mask: true
mask_ratio: 4
pose: 12.0
kobj: 1.0
rle: 1.0
nms: false
max_det: 300
iou: 0.7

# ---------- ЛОГИ И ВЫВОД ----------
project: training/runs/rdd_split
name: yolov8s_base
exist_ok: false
save: true
save_period: 10
plots: true