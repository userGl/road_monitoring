# Конфигурация сервиса

# Конфигурация тестового входного RTSP потока
# Эти настройки используются скриптами публикации тестового видео
vlc:
  video: test_videos/2023_0814_090243_039A_SOS.MOV
  rtsp_port: 8554
  rtsp_path: live

# Настройки Python-сервиса обработки видео
stream:
  input_rtsp_url: "rtsp://127.0.0.1:8554/live"
  output_rtsp_url: "rtsp://127.0.0.1:8554/preview"
  enable_output_stream: false

camera:
  use_hwaccel: true

model_input:
  width: 640
  height: 640

detector:
  model_path: models/YOLOv8_Small_RDD.pt
  confidence_threshold: 0.05
